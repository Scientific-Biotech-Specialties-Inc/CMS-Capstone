name: CMS Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  workflows:
    name: Validate GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            --output "$archive"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml

  frontend:
    name: Vue unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - name: Build with the production image defaults
        run: |
          cp .env.example .env.production
          npm run build

  backend:
    name: "Laravel tests (${{ matrix.service }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [ai-service, analytics-service, contract-management, notification, search, vendor-management]
    defaults:
      run:
        working-directory: "services/${{ matrix.service }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, gd, intl, mongodb, pdo_sqlite, zip
          coverage: none
          tools: composer:v2
      - name: Install dependencies and run tests
        run: |
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export INTERNAL_SERVICE_SECRET="$(openssl rand -hex 32)"
          composer install --no-interaction --no-progress --prefer-dist
          vendor/bin/phpunit --exclude-group atlas
